<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Licious - API Connection Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .test-button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .test-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .test-button:active {
            transform: translateY(0);
        }

        .results {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .module-section {
            margin-bottom: 30px;
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .endpoint {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .endpoint:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .endpoint-name {
            font-weight: 500;
            color: #495057;
        }

        .endpoint-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-loading {
            background: #fff3cd;
            color: #856404;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
            text-align: center;
        }

        .summary h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥛 Dairy Licious Management System</h1>
            <p>Database Connection & API Test Dashboard</p>
        </div>

        <button class="test-button" onclick="testAllAPIs()">
            🧪 Test All APIs & Database Connection
        </button>

        <div id="results" class="results hidden">
            <!-- Finance Module -->
            <div class="module-section">
                <div class="module-header">💰 Finance Module</div>
                <div id="finance-endpoints"></div>
            </div>

            <!-- HR Module -->
            <div class="module-section">
                <div class="module-header">👥 HR Module</div>
                <div id="hr-endpoints"></div>
            </div>

            <!-- Employee Module -->
            <div class="module-section">
                <div class="module-header">👔 Employee Module</div>
                <div id="employee-endpoints"></div>
            </div>

            <!-- Inventory Module -->
            <div class="module-section">
                <div class="module-header">📦 Inventory Module</div>
                <div id="inventory-endpoints"></div>
            </div>

            <!-- Delivery Module -->
            <div class="module-section">
                <div class="module-header">🚚 Delivery Module</div>
                <div id="delivery-endpoints"></div>
            </div>

            <!-- Order Management Module -->
            <div class="module-section">
                <div class="module-header">📋 Order Management Module</div>
                <div id="order-endpoints"></div>
            </div>

            <!-- Summary -->
            <div class="summary">
                <h2>📊 Test Summary</h2>
                <div class="summary-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="total-tests">0</div>
                        <div class="stat-label">Total Endpoints</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="successful-tests">0</div>
                        <div class="stat-label">Successful</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="failed-tests">0</div>
                        <div class="stat-label">Failed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="total-records">0</div>
                        <div class="stat-label">Total Records</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';

        const endpoints = {
            finance: [
                { name: 'Allowances', url: '/finance/allowances' },
                { name: 'Additional Expenses', url: '/finance/expenses' },
                { name: 'Salary Slips', url: '/finance/salary-slips' }
            ],
            hr: [
                { name: 'HR Employees', url: '/hr/employees' },
                { name: 'HR Attendance', url: '/hr/attendance' },
                { name: 'HR Leaves', url: '/hr/leaves' },
                { name: 'HR Payroll', url: '/hr/payroll' }
            ],
            employee: [
                { name: 'Employees', url: '/employee/employees' },
                { name: 'Employee Attendance', url: '/employee/attendance' },
                { name: 'Employee Leaves', url: '/employee/leaves' }
            ],
            inventory: [
                { name: 'Products', url: '/inventory/products' },
                { name: 'Milk Collection', url: '/inventory/milk-collection' },
                { name: 'Raw Milk', url: '/inventory/raw-milk' }
            ],
            delivery: [
                { name: 'Deliveries', url: '/delivery/deliveries' },
                { name: 'Drivers', url: '/delivery/drivers' },
                { name: 'Farmers', url: '/delivery/farmers' },
                { name: 'Milk Collection', url: '/delivery/milk-collection' },
                { name: 'Orders', url: '/delivery/orders' },
                { name: 'Payments', url: '/delivery/payments' }
            ],
            order: [
                { name: 'Orders', url: '/order/orders' },
                { name: 'Order Statistics', url: '/order/stats' }
            ]
        };

        function createEndpointElement(name, id) {
            return `
                <div class="endpoint" id="${id}">
                    <span class="endpoint-name">${name}</span>
                    <div class="endpoint-status">
                        <span class="status-badge status-loading">Testing...</span>
                        <div class="loading"></div>
                    </div>
                </div>
            `;
        }

        async function testEndpoint(module, endpoint, id) {
            try {
                const response = await fetch(API_BASE_URL + endpoint.url);
                const data = await response.json();
                
                if (response.ok) {
                    const count = data.data?.length || data.count || data.results?.length || 
                                 (Array.isArray(data) ? data.length : 0);
                    
                    document.getElementById(id).innerHTML = `
                        <span class="endpoint-name">${endpoint.name}</span>
                        <div class="endpoint-status">
                            <span class="status-badge status-success">✓ ${count} records</span>
                        </div>
                    `;
                    return { success: true, count };
                } else {
                    document.getElementById(id).innerHTML = `
                        <span class="endpoint-name">${endpoint.name}</span>
                        <div class="endpoint-status">
                            <span class="status-badge status-error">✗ No data</span>
                        </div>
                    `;
                    return { success: false, count: 0 };
                }
            } catch (error) {
                document.getElementById(id).innerHTML = `
                    <span class="endpoint-name">${endpoint.name}</span>
                    <div class="endpoint-status">
                        <span class="status-badge status-error">✗ Error: ${error.message}</span>
                    </div>
                `;
                return { success: false, count: 0 };
            }
        }

        async function testAllAPIs() {
            // Show results container
            document.getElementById('results').classList.remove('hidden');

            // Clear previous results
            Object.keys(endpoints).forEach(module => {
                document.getElementById(`${module}-endpoints`).innerHTML = '';
            });

            // Create endpoint elements
            let endpointId = 0;
            Object.keys(endpoints).forEach(module => {
                endpoints[module].forEach(endpoint => {
                    const id = `endpoint-${endpointId++}`;
                    document.getElementById(`${module}-endpoints`).innerHTML += 
                        createEndpointElement(endpoint.name, id);
                });
            });

            // Test all endpoints
            const results = [];
            endpointId = 0;
            
            for (const module of Object.keys(endpoints)) {
                for (const endpoint of endpoints[module]) {
                    const id = `endpoint-${endpointId++}`;
                    const result = await testEndpoint(module, endpoint, id);
                    results.push(result);
                }
            }

            // Update summary
            const totalTests = results.length;
            const successfulTests = results.filter(r => r.success).length;
            const failedTests = totalTests - successfulTests;
            const totalRecords = results.reduce((sum, r) => sum + r.count, 0);

            document.getElementById('total-tests').textContent = totalTests;
            document.getElementById('successful-tests').textContent = successfulTests;
            document.getElementById('failed-tests').textContent = failedTests;
            document.getElementById('total-records').textContent = totalRecords;
        }
    </script>
</body>
</html>
